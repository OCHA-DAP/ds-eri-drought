[project]
name = "ds-eri-drought"
version = "0.1.0"
description = "Eritrea JJA 2026 rainfall, NDVI and CDI compared with past seasons"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.1.4",
    "hdx-python-api>=6.7.0",
    "jupyter>=1.1.1",
    "jupytext>=1.19.5",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "numpy>=2.4.6",
    "ocha-stratus>=0.1.9",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "rasterio>=1.4.4",
    "rioxarray>=0.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eri_drought"]
